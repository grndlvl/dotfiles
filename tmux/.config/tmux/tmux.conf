# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'alexwforsythe/tmux-which-key'

# ============================================================================
# Omarchy Tmux Integration (v2.1)
# Theme profiles persist in ~/.config/tmux/omarchy-themes/
# Current theme syncs via symlink - DO NOT EDIT THIS SECTION
# ============================================================================
source-file ~/.config/tmux/omarchy-current-theme.conf
# End Omarchy Tmux Integration

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Move pane to window N
bind-key S command-prompt -p "Move pane to window:" "move-pane -t :%%"

# Use vim keybidings for copying and moving between panes.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
set-window-option -g mouse on
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/TODO.md"

# Move the status bar to the top.
set-option -g status-position top

# Fix colors.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",screen-256color*:Tc"

# You can also use the env variable set from the terminal.
# Useful if you share your configuration betweeen systems with a varying value.
#set -ag terminal-overrides ",$TERM:RGB"

set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_name}"

# New windows and panes should open up from the CWD.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Pass Shift+Enter through to applications (e.g. Claude Code multi-line input)
bind -n S-Enter send-keys Escape "[13;2u"

# Hide right status bar items (persists across theme changes)
set -g status-right ""

# Claude session switcher
bind-key a display-popup -E -w 90 -h 15 "~/.local/bin/ai-coding-sessions"

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
#bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
#bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
#bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
#bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"
